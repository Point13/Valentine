<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Will you be my Valentine? 💕</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --pink-light: #fce4ec;
    --pink-mid:   #f48fb1;
    --pink-dark:  #e91e63;
    --cream:      #fff9fb;
    --text:       #4a1942;
    --yes-bg:     #e91e63;
    --yes-hover:  #c2185b;
    --no-bg:      #aaa;
    --no-hover:   #999;
  }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--pink-light);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* floating hearts background */
  .hearts-bg {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
  }
  .heart-float {
    position: absolute;
    opacity: 0;
    animation: floatHeart linear infinite;
    font-size: 1.4rem;
    color: var(--pink-mid);
  }
  @keyframes floatHeart {
    0%   { transform: translateY(100vh) rotate(0deg); opacity: 0; }
    10%  { opacity: 0.35; }
    90%  { opacity: 0.35; }
    100% { transform: translateY(-120px) rotate(360deg); opacity: 0; }
  }

  /* ---------- CARD ---------- */
  .card {
    position: relative; z-index: 1;
    background: var(--cream);
    border-radius: 28px;
    box-shadow: 0 12px 48px rgba(233,30,99,.18);
    padding: 48px 40px 44px;
    max-width: 440px;
    width: 90%;
    text-align: center;
    animation: cardPop .5s cubic-bezier(.175,.885,.32,1.275) both;
  }
  @keyframes cardPop {
    0%   { transform: scale(.7); opacity: 0; }
    100% { transform: scale(1);  opacity: 1; }
  }

  /* cat avatar */
  .cat-avatar {
    width: 100px; height: 100px;
    margin: 0 auto 24px;
    position: relative;
    animation: heartbeat 1.4s ease-in-out infinite;
  }
  @keyframes heartbeat {
    0%,100% { transform: scale(1); }
    14%     { transform: scale(1.08); }
    28%     { transform: scale(1); }
  }
  .cat-avatar svg { width: 100%; height: 100%; }

  /* question */
  .question {
    font-family: 'Pacifico', cursive;
    font-size: 1.55rem;
    color: var(--text);
    line-height: 1.45;
    margin-bottom: 32px;
  }

  /* buttons wrapper — needs position:relative so No can be placed absolutely */
  .btn-wrap {
    position: relative;
    min-height: 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  /* YES button */
  .btn-yes {
    position: relative; z-index: 2;
    background: var(--yes-bg);
    color: #fff;
    border: none;
    padding: 14px 44px;
    border-radius: 50px;
    font-family: 'Nunito', sans-serif;
    font-size: 1.15rem;
    font-weight: 800;
    cursor: pointer;
    transition: background .2s, transform .15s;
    box-shadow: 0 4px 14px rgba(233,30,99,.35);
  }
  .btn-yes:hover {
    background: var(--yes-hover);
    transform: scale(1.06);
  }

  /* NO button — absolutely positioned so JS can move it */
  .btn-no {
    position: absolute;
    z-index: 2;
    background: var(--no-bg);
    color: #fff;
    border: none;
    padding: 10px 32px;
    border-radius: 50px;
    font-family: 'Nunito', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: background .15s;
    /* start below Yes */
    top: 56px;
    left: 50%;
    transform: translateX(-50%);
    user-select: none;
    white-space: nowrap;
  }
  .btn-no:hover { background: var(--no-hover); }

  .shy-text {
    font-size: .78rem;
    color: #aaa;
    margin-top: 4px;
    font-style: italic;
    position: relative; z-index: 1;
  }

  /* ---------- YAY SCREEN (hidden initially) ---------- */
  .yay-screen {
    display: none;
    position: fixed; inset: 0; z-index: 100;
    background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 50%, #f48fb1 100%);
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    animation: fadeIn .4s ease;
  }
  .yay-screen.show { display: flex; }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

  .yay-title {
    font-family: 'Pacifico', cursive;
    font-size: 3.2rem;
    color: var(--text);
    margin-bottom: 8px;
    animation: bounceIn .6s cubic-bezier(.175,.885,.32,1.275) both;
  }
  @keyframes bounceIn {
    0%   { transform: scale(.3); opacity: 0; }
    60%  { transform: scale(1.15); }
    100% { transform: scale(1);   opacity: 1; }
  }

  .yay-sub {
    font-size: 1.1rem;
    color: #ad1457;
    font-weight: 700;
    margin-bottom: 28px;
    animation: bounceIn .6s .15s cubic-bezier(.175,.885,.32,1.275) both;
  }

  .gif-row {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 24px;
  }
  .gif-box {
    width: 140px; height: 140px;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 6px 20px rgba(0,0,0,.15);
    background: #fff;
    animation: popIn .5s cubic-bezier(.175,.885,.32,1.275) both;
  }
  .gif-box:nth-child(2) { animation-delay: .15s; }
  .gif-box:nth-child(3) { animation-delay: .3s; }
  @keyframes popIn {
    0%   { transform: scale(0) rotate(-8deg); opacity:0; }
    100% { transform: scale(1) rotate(0);     opacity:1; }
  }
  .gif-box img { width:100%; height:100%; object-fit:cover; }

  .heart-big {
    font-size: 2.8rem;
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50%     { transform: scale(1.3); }
  }

  /* confetti canvas */
  #confetti-canvas {
    position: fixed; inset: 0; pointer-events: none; z-index: 99;
  }
</style>
</head>
<body>

<!-- floating hearts -->
<div class="hearts-bg" id="heartsBg"></div>

<!-- main card -->
<div class="card" id="card">
  <!-- cute cat SVG avatar -->
  <div class="cat-avatar">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <!-- ears -->
      <polygon points="18,38 10,8 34,28" fill="#f5a623"/>
      <polygon points="82,38 90,8 66,28" fill="#f5a623"/>
      <polygon points="21,36 16,18 31,29" fill="#f8c99a"/>
      <polygon points="79,36 84,18 69,29" fill="#f8c99a"/>
      <!-- head -->
      <ellipse cx="50" cy="52" rx="32" ry="30" fill="#f5a623"/>
      <!-- cheeks -->
      <ellipse cx="36" cy="58" rx="7" ry="5" fill="#f8c99a"/>
      <ellipse cx="64" cy="58" rx="7" ry="5" fill="#f8c99a"/>
      <!-- eyes -->
      <circle cx="38" cy="50" r="4" fill="#222"/>
      <circle cx="62" cy="50" r="4" fill="#222"/>
      <!-- eye shine -->
      <circle cx="39.5" cy="48.5" r="1.4" fill="#fff"/>
      <circle cx="63.5" cy="48.5" r="1.4" fill="#fff"/>
      <!-- nose -->
      <polygon points="50,56 47,53 53,53" fill="#e91e63"/>
      <!-- mouth -->
      <path d="M47,57 Q50,60 53,57" stroke="#e91e63" stroke-width="1.3" fill="none" stroke-linecap="round"/>
      <!-- heart accessory -->
      <g transform="translate(72,22)">
        <path d="M0,4 C0,1.5 2.5,-1 5,2 C7.5,-1 10,1.5 10,4 C10,7 5,11 5,11 C5,11 0,7 0,4Z" fill="#e91e63"/>
      </g>
    </svg>
  </div>

  <p class="question">Roma will you be my Valentine? 💕</p>

  <div class="btn-wrap" id="btnWrap">
    <button class="btn-yes" id="btnYes">Yes</button>
    <button class="btn-no"  id="btnNo" >No</button>
    <span class="shy-text">"No" seems a bit shy 🥺</span>
  </div>
</div>

<!-- YAY celebration screen -->
<div class="yay-screen" id="yayScreen">
  <div class="yay-title">YAY! 🎉</div>
  <div class="yay-sub">Roma said Yes! 💕</div>
  <div class="gif-row">
    <div class="gif-box"><img src="https://giphy.com/static/gifmaker.gif" alt="" onerror="this.style.display='none'"/></div>
    <div class="gif-box"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/4e/Heart_suit_symbol_for_cards.svg/800px-Heart_suit_symbol_for_cards.svg.png" alt="" style="padding:20px;background:#fff;"/></div>
    <div class="gif-box"><img src="https://giphy.com/static/gifmaker.gif" alt="" onerror="this.style.display='none'"/></div>
  </div>
  <div class="heart-big">❤️</div>
</div>

<canvas id="confetti-canvas"></canvas>

<script>
// ---- floating hearts ----
(function(){
  const bg = document.getElementById('heartsBg');
  const symbols = ['♥','❤','💕','💗','💖','💝'];
  for(let i=0;i<18;i++){
    const h = document.createElement('div');
    h.className = 'heart-float';
    h.textContent = symbols[i%symbols.length];
    h.style.left = (Math.random()*100)+'%';
    h.style.animationDuration = (6+Math.random()*8)+'s';
    h.style.animationDelay = (Math.random()*8)+'s';
    h.style.fontSize = (.9+Math.random()*1.2)+'rem';
    bg.appendChild(h);
  }
})();

// ---- NO button run-away logic ----
(function(){
  const wrap   = document.getElementById('btnWrap');
  const btnNo  = document.getElementById('btnNo');
  const btnYes = document.getElementById('btnYes');
  let attempts = 0;
  const shyTexts = [
    '"No" seems a bit shy 🥺',
    'Hmm… "No" is hiding 😅',
    'Looks like "No" ran away! 🏃💨',
    '"No" is playing hide & seek 🙈',
    'Can\'t find "No" anywhere… 👀',
    'Maybe "No" doesn\'t want to be clicked? 😈'
  ];

  function getRandomPos() {
    const wW = wrap.offsetWidth;
    const wH = wrap.offsetHeight || 120;
    const bW = btnNo.offsetWidth;
    const bH = btnNo.offsetHeight;
    // keep it inside the card but away from Yes
    const x = Math.random()*(wW - bW) - bW*0.3;
    const y = 44 + Math.random()*50;          // always below Yes
    return { x, y };
  }

  btnNo.addEventListener('mouseover', function onHover(){
    attempts++;
    // smoothly jump to a random spot
    const pos = getRandomPos();
    btnNo.style.transition = 'left .18s cubic-bezier(.68,-.55,.265,1.55), top .18s cubic-bezier(.68,-.55,.265,1.55)';
    btnNo.style.left  = pos.x + 'px';
    btnNo.style.top   = pos.y + 'px';
    btnNo.style.transform = 'none';            // cancel initial translateX

    // update shy text
    const shy = document.querySelector('.shy-text');
    shy.textContent = shyTexts[Math.min(attempts, shyTexts.length-1)];

    // grow card a tiny bit so button doesn't clip (only first few times)
    if(attempts <= 3){
      document.getElementById('card').style.minHeight = '320px';
    }
  });

  // ---- YES click → celebration ----
  btnYes.addEventListener('click', function(){
    document.getElementById('card').style.display = 'none';
    document.getElementById('yayScreen').classList.add('show');
    startConfetti();
  });
})();

// ---- Confetti ----
(function(){
  const canvas = document.getElementById('confetti-canvas');
  const ctx    = canvas.getContext('2d');
  let pieces   = [];
  let animating = false;

  function resize(){
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  class Confetti {
    constructor(){
      this.x = Math.random()*canvas.width;
      this.y = -20;
      this.w = 8 + Math.random()*6;
      this.h = this.w * 0.5;
      this.vx= (Math.random()-0.5)*3;
      this.vy= 2 + Math.random()*4;
      this.rot= Math.random()*Math.PI*2;
      this.rotV= (Math.random()-0.5)*0.3;
      const hues = ['#e91e63','#ff4081','#f06292','#ffd54f','#ffab40','#ffffff','#ce93d8','#80cbc4'];
      this.color = hues[Math.floor(Math.random()*hues.length)];
    }
    update(){
      this.x += this.vx;
      this.y += this.vy;
      this.vy *= 0.998;  // slight drag
      this.rot += this.rotV;
      // gentle sway
      this.x += Math.sin(this.y*0.04)*0.5;
    }
    draw(){
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.rot);
      ctx.fillStyle = this.color;
      ctx.fillRect(-this.w/2, -this.h/2, this.w, this.h);
      ctx.restore();
    }
  }

  window.startConfetti = function(){
    pieces = [];
    for(let i=0;i<160;i++){
      const c = new Confetti();
      c.y = -Math.random()*200;  // stagger start
      pieces.push(c);
    }
    if(!animating){ animating=true; loop(); }
  };

  function loop(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p=>{ p.update(); p.draw(); });
    // remove off-screen
    pieces = pieces.filter(p=> p.y < canvas.height + 40);
    // keep spawning for 4 seconds
    if(pieces.length < 200 && Date.now() - (window._confStart||Date.now()) < 4000){
      for(let i=0;i<3;i++) pieces.push(new Confetti());
    }
    if(pieces.length > 0) requestAnimationFrame(loop);
    else animating = false;
  }

  // record start time when confetti fires
  const orig = window.startConfetti;
  window.startConfetti = function(){
    window._confStart = Date.now();
    orig();
  };
})();
</script>
